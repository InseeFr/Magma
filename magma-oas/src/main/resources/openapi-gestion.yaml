openapi: 3.1.0
info:
  title: Magma Gestion API
  description: API de gestion des métadonnées statistiques
  contact:
    name: dr59-sndil
    url: https://www.insee.fr/fr/accueil
    email: dr59-sinl-equipe-maintenance-rmes@insee.fr
  version: ${version}
tags:
  - name: Series-Operations
    description: Consultation des Séries et Opérations de la base de gestion
  - name: Datasets
    description: Consultation Magma API - datasets
servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:

  # ============================================
  # SERIES / OPERATIONS
  # ============================================
  /operations/series:
    get:
      tags:
        - Series-Operations
      summary: Get all series
      operationId: getAllSeries
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SeriesListe200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'




  /operations/serie/{id}:
    get:
      tags:
        - Series-Operations
      summary: Get one serie
      operationId: getSerieById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Serie200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'

  /operations/operation/{id}:
    get:
      tags:
        - Series-Operations
      summary: Get operation by code
      operationId: getOperationByCode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Operation200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'

  /operations/indicateur/{id}:
    get:
      tags:
        - Series-Operations
      summary: Get one indicator
      operationId: getIndicatorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Indicateur200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'


  # ============================================
  # DATASETS
  # ============================================

  /dataset/{id}:
    get:
      tags:
        - Datasets
      summary: Get one dataset
      operationId: getDataSetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Dataset200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'

  /dataset/{id}/distributions:
    get:
      tags:
        - Datasets
      summary: Get dataset distributions
      operationId: getDataSetDistributionsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DistributionsListe200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'


  /datasets/list:
    get:
      tags:
        - Datasets
      summary: Get list of datasets
      operationId: getListDatasets
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DatasetsListe200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    IncorrectRequest:
      description: 'La syntaxe de la requête est incorrecte'

    NotFound:
      description: 'Ressource non trouvée'

    NotAcceptable:
      description: 'L''en-tête HTTP ''Accept'' contient une valeur non acceptée'

    ServerError:
      description: 'Erreur interne du serveur'


    Serie200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Serie'
          examples:
            défaut:
              $ref: '#/components/examples/Serie'
        application/xml:
          schema:
            $ref: '#/components/schemas/Serie'
          examples:
            défaut:
              $ref: '#/components/examples/Serie'


    SeriesListe200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListeSeries'
          examples:
            défaut:
              $ref: '#/components/examples/ListeSeries'
        application/xml:
          schema:
            $ref: '#/components/schemas/ListeSeries'
          examples:
            défaut:
              $ref: '#/components/examples/ListeSeries'

    Operation200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
          examples:
            défaut:
              $ref: '#/components/examples/Operation'
        application/xml:
          schema:
            $ref: '#/components/schemas/Operation'
          examples:
            défaut:
              $ref: '#/components/examples/Operation'

    Indicateur200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Indicateur'
          examples:
            défaut:
              $ref: '#/components/examples/Indicateur'
        application/xml:
          schema:
            $ref: '#/components/schemas/Indicateur'
          examples:
            défaut:
              $ref: '#/components/examples/Indicateur'



    Dataset200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Dataset'
          examples:
            défaut:
              $ref: '#/components/examples/Dataset'
        application/xml:
          schema:
            $ref: '#/components/schemas/Dataset'
          examples:
            défaut:
              $ref: '#/components/examples/Dataset'

    DistributionsListe200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListeDistributions'
          examples:
            défaut:
              $ref: '#/components/examples/ListeDistributions'
        application/xml:
          schema:
            $ref: '#/components/schemas/ListeDistributions'
          examples:
            défaut:
              $ref: '#/components/examples/ListeDistributions'

    DatasetsListe200:
      description: 'Opération réussie pour les datasets'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListeDatasets'
          examples:
            défaut:
              $ref: '#/components/examples/ListeDatasets'
        application/xml:
          schema:
            $ref: '#/components/schemas/ListeDatasets'
          examples:
            défaut:
              $ref: '#/components/examples/ListeDatasets'

  schemas:
    # ============================================
    # COMMON / SHARED SCHEMAS
    # ============================================

    IdLabel:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: array
          items:
            $ref: './langue-contenu.schema.json'


    # ============================================
    # SERIES / OPERATIONS SCHEMAS
    # ============================================

    ListeSeries:
      description: 'Liste des séries'
      type: array
      xml:
        wrapped: true
        name: Definition
      items:
        $ref: '#/components/schemas/Serie'

    Serie:
      type: object
      properties:
        seriesId:
          type: string
        uri:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        altLabel:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        resume:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        noteHistorique:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        type:
          $ref: 'id-uri-label.schema.json'
        frequenceCollecte:
          $ref: 'id-uri-label.schema.json'
        rapportQualite:
          $ref: 'id-uri.schema.json'
        famille:
          $ref: 'id-uri-label.schema.json'
        seriesPrecedentes:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        seriesSuivantes:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        seriesLiees:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        operations:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        indicateurs:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        dateCreation:
          type: string
          format: date
        dateMiseAJour:
          type: string
          format: date
        proprietaires:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        organismesResponsables:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        partenaires:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        servicesCollecteurs:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        statutValidation:
          type: string
        series:
          type: string
        frequence:
          $ref: 'id-uri-label.schema.json'
        nbOperation:
          type: string

    Frequence:
      type: object
      properties:
        id:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string


    SerieRef:
      type: object
      properties:
        id:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        frequence:
          $ref: '#/components/schemas/Frequence'

    Operation:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        altLabel:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        millesime:
          type: string
        serie:
          $ref: '#/components/schemas/SerieRef'
        rapportQualite:
          $ref: './id-uri.schema.json'
        dateCreation:
          type: string
          format: date
        dateMiseAJour:
          type: string
          format: date
        statutValidation:
          type: string

    Indicateur:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        label:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        altLabel:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        resume:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        noteHistorique:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        frequenceCollecte:
          $ref: './id-uri-label.schema.json'
        rapportQualite:
          $ref: './id-uri.schema.json'
        seriesContributrices:
          type: array
          items:
            $ref: './id-uri-label.schema.json'
        seriesLiees:
          type: array
          items:
            $ref: './id-uri-label.schema.json'
        indicateursLies:
          type: array
          items:
            $ref: './id-uri-label.schema.json'
        dateCreation:
          type: string
        dateMiseAJour:
          type: string
        proprietaires:
          type: array
          items:
            $ref: './id-uri-label.schema.json'
        organismesResponsables:
          type: array
          items:
            $ref: './id-uri-label.schema.json'
        partenaires:
          type: array
          items:
            $ref: './id-uri-label.schema.json'
        statuValidation:
          type: string

    # ============================================
    # DATASETS SCHEMAS
    # ============================================

    Theme:
      type: object
      properties:
        uri:
          type: string
        label:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        themeTaxonomy:
          type: string

    LandingPage:
      type: object
      properties:
        lang:
          type: string
        url:
          type: string

    ProcessStep:
      type: object
      properties:
        id:
          type: string
        label:
          $ref: 'langue-contenu.schema.json'

    Temporal:
      type: object
      properties:
        startPeriod:
          type: string
        endPeriod:
          type: string

    Structure:
      type: object
      properties:
        uri:
          type: string
        id:
          type: string
        dsd:
          type: string

    WasDerivedFrom:
      type: object
      properties:
        datasets:
          type: array
          items:
            type: string
        description:
          type: array
          items:
            $ref: './langue-contenu.schema.json'


    ListeDistributions:
      description: 'Liste des distributions'
      type: array
      xml:
        wrapped: true
        name: Definition
      items:
        $ref: '#/components/schemas/Distribution'

    Distribution:
      type: object
      properties:
        identifier:
          type: string
        byteSize:
          type: string
        created:
          type: string
        description:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        downloadURL:
          type: array
          items:
            type: string
        format:
          type: string
        modified:
          type: string
        title:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        uri:
          type: string

    Dataset:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        catalogRecordCreated:
          type: string
        catalogRecordModified:
          type: string
        catalogRecordCreator:
          type: string
        catalogRecordContributor:
          type: string
        identifier:
          type: string
        issued:
          type: string
        modified:
          type: string
        disseminationStatus:
          type: string
        validationState:
          type: string
        version:
          type: string
        creator:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        publisher:
          $ref: '#/components/schemas/IdLabel'
        title:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        subtitle:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        abstract:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        description:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        scopeNote:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        wasGeneratedBy:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        type:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        archiveUnit:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        accessRights:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        confidentialityStatus:
          type: array
          items:
            $ref: './langue-contenu.schema.json'
        theme:
          type: array
          items:
            $ref: '#/components/schemas/Theme'
        landingPage:
          type: array
          items:
            $ref: '#/components/schemas/LandingPage'
        processStep:
          $ref: '#/components/schemas/ProcessStep'
        accrualPeriodicity:
          $ref: 'langue-contenu.schema.json'
        temporal:
          $ref: '#/components/schemas/Temporal'
        temporalResolution:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        spatial:
          $ref: '#/components/schemas/IdLabel'
        spatialResolution:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        spatialTemporal:
          type: string
        statisticalUnit:
          type: array
          items:
            $ref: '#/components/schemas/IdLabel'
        structure:
          $ref: '#/components/schemas/Structure'
        numObservations:
          type: integer
          format: int32
        numSeries:
          type: integer
          format: int32
        wasDerivedFrom:
          $ref: '#/components/schemas/WasDerivedFrom'
        relations:
          type: array
          items:
            type: string
        keyword:
          type: array
          items:
            $ref: './langue-contenu.schema.json'


    ListeDatasets:
      description: 'Liste des datasets'
      type: array
      xml:
        wrapped: true
        name: Definition
      items:
        $ref: '#/components/schemas/Dataset'

  examples:

    Serie:
      value:
