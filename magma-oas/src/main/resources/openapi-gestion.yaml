            langue: 'en'
        type:
          id: '5'
          uri: 'http://bauhaus/codes/categorieSource/S'
          label:
            - contenu: 'Enquête'
              langue: 'fr'
            - contenu: 'Survey'
              langue: 'en'
        frequenceCollecte:
          id: 'I'
          uri: 'http://bauhaus/codes/frequence/I'
          label:
            - contenu: 'Bisannuelle'
              langue: 'fr'
            - contenu: 'Biennial'
              langue: 'en'
        famille:
          id: 's15'
          uri: 'http://bauhaus/operations/famille/s15'
          label:
            - contenu: 'Innovation'
              langue: 'fr'
            - contenu: 'Innovation'
              langue: 'en'
        seriesPrecedentes:
          - id: 's1010'
            uri: 'http://bauhaus/operations/serie/s1010'
            label:
              - contenu: 'Enquête sur les compétences pour innover'
                langue: 'fr'
              - contenu: 'Innovative skills survey'
                langue: 'en'
        seriesSuivantes:
          -
