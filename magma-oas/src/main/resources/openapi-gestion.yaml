openapi: 3.1.0
info:
  title: Magma Gestion API
  description: API de gestion des métadonnées statistiques
  contact:
    name: dr59-sndil
    url: https://www.insee.fr/fr/accueil
    email: dr59-sinl-equipe-maintenance-rmes@insee.fr
  version: 1.4.11
tags:
  - name: Codes lists
    description: Consultation Gestion API - listes des codes
  - name: Organisations
    description: Consultation des organisations de la base de gestion
  - name: Structures/Composants
    description: Consultation Magma API - Structures/Composants
  - name: Concepts
    description: Consultation Gestion API - Concepts
  - name: Series-Operations
    description: Consultation des Séries et Opérations de la base de gestion
  - name: Datasets
    description: Consultation Magma API - datasets
servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  # ============================================
  # STRUCTURES / COMPOSANTS
  # ============================================
  /structures:
    get:
      tags:
        - Structures/Composants
      summary: Get all structures
      operationId: getAllStructures
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllStructure'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /structure/{id}:
    get:
      tags:
        - Structures/Composants
      summary: Get a structure
      operationId: getStructure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dateMiseAJour
          in: query
          description: If true, returns only the update date
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /structure/{id}/sliceKeys:
    get:
      tags:
        - Structures/Composants
      summary: Get slice keys
      operationId: getSliceKeys
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructureSliceKeys'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /composants:
    get:
      tags:
        - Structures/Composants
      summary: Get all components
      operationId: getAllComponents
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllComponent'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /composant/{id}:
    get:
      tags:
        - Structures/Composants
      summary: Get a component
      operationId: getComponentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dateMiseAJour
          in: query
          description: If true, returns only the update date
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  # ============================================
  # ORGANISATIONS
  # ============================================
  /organisations:
    get:
      tags:
        - Organisations
      summary: Get all organisations
      operationId: getAllOrganisations
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organisation'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /organisation/{id}/:
    get:
      tags:
        - Organisations
      summary: Get one organisation
      operationId: getOrganisationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '404':
          description: Not found
        '500':
          description: Internal server error

  # ============================================
  # SERIES / OPERATIONS (Pogues)
  # ============================================
  /operations/series:
    get:
      tags:
        - Series-Operations
      summary: Get all series
      operationId: getAllSeries
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerieById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /operations/serie/{id}:
    get:
      tags:
        - Series-Operations
      summary: Get one serie
      operationId: getSerieById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerieById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /operations/operation/{id}:
    get:
      tags:
        - Series-Operations
      summary: Get operation by code
      operationId: getOperationByCode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /operations/indicateur/{id}:
    get:
      tags:
        - Series-Operations
      summary: Get one indicator
      operationId: getIndicatorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indicateur'
        '404':
          description: Not found
        '500':
          description: Internal server error


  # ============================================
  # CODES LISTS
  # ============================================
  /listesCodes:
    get:
      tags:
        - Codes lists
      summary: Get all codes lists
      operationId: getAllCodesLists
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllListCode'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /listeCode/{id}:
    get:
      tags:
        - Codes lists
      summary: Get one codes list
      operationId: getCodesList
      parameters:
        - name: id
          in: path
          description: Notation of the code list
          required: true
          schema:
            type: string
        - name: dateMiseAJour
          in: query
          description: If true, returns only the update date
          required: false
          schema:
            type: boolean
            default: false
        - name: withCodes
          in: query
          description: Include codes in the response
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCodeById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /listeCode/{id}/pagination:
    get:
      tags:
        - Codes lists
      summary: Get one codes list with 5 codes per page
      operationId: getCodesListPagination
      parameters:
        - name: id
          in: path
          description: Notation of the code list
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          description: Page number (starting from 0)
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCodeById'
        '404':
          description: Not found
        '416':
          description: Requested Range Not Satisfiable - Page does not exist
        '500':
          description: Internal server error

  # ============================================
  # DATASETS
  # ============================================
  /datasets/list:
    get:
      tags:
        - Datasets
      summary: Get list of datasets
      operationId: getListDatasets
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DatasetsListe200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'

  /dataset/{id}:
    get:
      tags:
        - Datasets
      summary: Get one dataset
      operationId: getDataSetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Dataset200'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Datasets
      summary: Update some properties of a dataset
      description: Update ObservationNumber, issued, modified, temporal, or numSeries of a dataset
      operationId: patchDataSet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: JSON with parameters you want to change
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDataset'
            example:
              issued: "2022-11-11"
              modified: "2023-12-31"
              temporal:
                startPeriod: "2020-01-01"
                endPeriod: "2024-01-01"
              numObservations: 150
              numSeries: 12
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error

  /dataset/{id}/distributions:
    get:
      tags:
        - Datasets
      summary: Get dataset distributions
      operationId: getDataSetDistributionsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Distribution'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error

  # ============================================
  # CONCEPTS
  # ============================================
  /concepts:
    get:
      tags:
        - Concepts
      summary: List of concepts
      operationId: getAllConcepts
      parameters:
        - name: dateMiseAJour
          in: query
          description: 'Date of last update. Example: 2023-01-31'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConceptById'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /concept/{id}:
    get:
      tags:
        - Concepts
      summary: Get one concept
      operationId: getDetailedConcept
      parameters:
        - name: id
          in: path
          description: 'Identifiant du concept (format : c[0-9]{4})'
          required: true
          schema:
            type: string
            pattern: 'c[0-9]{4}'
          example: c2066
        - name: dateMiseAJour
          in: query
          description: If true, returns only the update date
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllConcept'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /concepts/collection/{id}:
    get:
      tags:
        - Concepts
      summary: List of collection's concepts
      operationId: getCollectionOfConcepts
      parameters:
        - name: id
          in: path
          description: Identifiant interne de la collection
          required: true
          schema:
            type: string
          example: definitions-insee-fr
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionOfConcepts'
        '404':
          description: Not found
        '500':
          description: Internal server error

  /concepts/collection/{id}/concepts:
    get:
      tags:
        - Concepts
      summary: Set of concepts in a collection
      operationId: getSetOfConceptsInACollection
      parameters:
        - name: id
          in: path
          description: Identifiant interne de la collection
          required: true
          schema:
            type: string
          example: definitions-insee-fr
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SetOfConcepts'
        '404':
          description: Not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    IncorrectRequest:
      description: 'La syntaxe de la requête est incorrecte'

    NotFound:
      description: 'Ressource non trouvée'

    NotAcceptable:
      description: 'L''en-tête HTTP ''Accept'' contient une valeur non acceptée'

    ServerError:
      description: 'Erreur interne du serveur'

    Dataset200:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Dataset'
          examples:
            défaut:
              $ref: '#/components/examples/Dataset'
        application/xml:
          schema:
            $ref: '#/components/schemas/Dataset'
          examples:
            défaut:
              $ref: '#/components/examples/Dataset'

    DatasetsListe200:
      description: 'Opération réussie pour les datasets'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListeDatasets'
          examples:
            défaut:
              $ref: '#/components/examples/ListeDatasets'
        application/xml:
          schema:
            $ref: '#/components/schemas/ListeDatasets'
          examples:
            défaut:
              $ref: '#/components/examples/ListeDatasets'

  schemas:
    # ============================================
    # COMMON / SHARED SCHEMAS
    # ============================================

    IdLabel:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: array
          items:
            $ref: './langue-contenu.schema.json'

    # ============================================
    # STRUCTURES / COMPOSANTS SCHEMAS
    # ============================================
    AllStructure:
      type: object
      properties:
        dateMiseAJour:
          type: string
        statutValidation:
          type: string
        id:
          type: string

    StructureById:
      type: object
      properties:
        dateMiseAJour:
          type: string
        dateCreation:
          type: string
        notation:
          type: string
        statutValidation:
          type: string
        mesures:
          type: array
          items:
            $ref: '#/components/schemas/Mesure'
        id:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        version:
          type: string
        attributs:
          type: array
          items:
            $ref: '#/components/schemas/Attribut'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'

    StructureSliceKeys:
      type: object
      properties:
        composants:
          type: array
          items:
            type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        type:
          type: string

    Mesure:
      type: object
      properties:
        ordre:
          type: string
        notation:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        representation:
          type: string

    Attribut:
      type: object
      properties:
        ordre:
          type: string
        notation:
          type: string
        listCode:
          $ref: '#/components/schemas/ListCodeRef'
        attachement:
          type: string
        obligatoire:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        representation:
          type: string

    Dimension:
      type: object
      properties:
        ordre:
          type: string
        notation:
          type: string
        listCode:
          $ref: '#/components/schemas/ListCodeRef'
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        representation:
          type: string

    ListCodeRef:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string

    AllComponent:
      type: object
      properties:
        dateMiseAJour:
          type: string
        statutValidation:
          type: string
        id:
          type: string

    ComponentById:
      type: object
      properties:
        dateMiseAJour:
          type: string
        dateCreation:
          type: string
        concept:
          $ref: '#/components/schemas/ConceptRef'
        statutValidation:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        type:
          type: string
        uri:
          type: string
        representation:
          type: string
        version:
          type: string
        notation:
          type: string
        id:
          type: string
        listeCode:
          $ref: '#/components/schemas/ListeCodeWithCodes'

    ConceptRef:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string

    ListeCodeWithCodes:
      type: object
      properties:
        codes:
          type: array
          items:
            $ref: '#/components/schemas/Code'
        id:
          type: string
        uri:
          type: string

    # ============================================
    # ORGANISATIONS SCHEMAS
    # ============================================
    Organisation:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        abreviation:
          type: string
        uniteDe:
          type: string
        sousTelleDe:
          type: string
        altlabel:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'

    # ============================================
    # SERIES / OPERATIONS SCHEMAS
    # ============================================
    SerieById:
      type: object
      properties:
        seriesId:
          type: string
        uri:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        altLabel:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        resume:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        noteHistorique:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        type:
          $ref: 'id-uri-label.schema.json'
        frequenceCollecte:
          $ref: 'id-uri-label.schema.json'
        rapportQualite:
          $ref: '#/components/schemas/RapportQualite'
        famille:
          $ref: 'id-uri-label.schema.json'
        seriesPrecedentes:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        seriesSuivantes:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        seriesLiees:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        operations:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        indicateurs:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        dateCreation:
          type: string
          format: date
        dateMiseAJour:
          type: string
          format: date
        proprietaires:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        organismesResponsables:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        partenaires:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        servicesCollecteurs:
          type: array
          items:
            $ref: 'id-uri-label.schema.json'
        statutValidation:
          type: string
        series:
          type: string
        frequence:
          $ref: 'id-uri-label.schema.json'
        nbOperation:
          type: string

    RapportQualite:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string

    Frequence:
      type: object
      properties:
        id:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string

    Famille:
      type: object
      properties:
        id:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string

    OperationBySerieId:
      type: object
      properties:
        altLabel:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        serie:
          $ref: '#/components/schemas/SerieRef'
        id:
          type: string
        millesime:
          type: string

    SerieRef:
      type: object
      properties:
        id:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        uri:
          type: string
        frequence:
          $ref: '#/components/schemas/Frequence'

    OperationById:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        label:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        altLabel:
          type: array
          items:
            $ref: 'langue-contenu.schema.json'
        millesime:
          type: string
        serie:
          $ref: '#/components/schemas/SerieRef'
        rapportQualite:
          $ref: '#/components/schemas/RapportQualite'
        dateCreation:
          type: string
          format: date
        dateMiseAJour:
          type: string
          format: date
        statutValidation:
          type: string

    Indicateur:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        label:
