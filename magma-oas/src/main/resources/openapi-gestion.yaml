            label:
              - contenu: 'Enquête innovation'
                langue: 'fr'
              - contenu: 'Innovation survey'
                langue: 'en'
        rapportQualite:
          - id: '2203'
            uri: 'http://bauhaus/qualite/rapport/2203'
