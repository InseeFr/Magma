          - langue: 'fr'
          - langue: 'en'
        resume:
          - contenu: '<p>Les statistiques des créations d''entreprises permettent de suivre l''évolution des créations d''entreprises relevant des principaux secteurs d''activité (Industrie, Construction, Commerce, Services).</p>'
            langue: 'fr'
