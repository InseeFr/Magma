            langue: 'en'
        resume:
          - contenu: '<p>L''enquête Capacité à innover et stratégie (CIS) permet d’une part, de mesurer le poids économique de ...'
            langue: 'fr'
          - contenu: '<p>The original objectives of the Community Innovation Survey (CIS) are to measure the economic weight of innovation in France...'
            langue: 'en'
        noteHistorique:
          - contenu: '<p>La première édition de l''enquête a été menée en 1993. L''enquête a été réalisée tous les 4 ans jusqu''en 2005...'
            langue: 'fr'
